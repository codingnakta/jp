<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>DAYEON WORK</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
  <link rel="stylesheet" href="css/chat.css" />
  <link rel="stylesheet" href="css/task.css" />
  <link rel="stylesheet" href="css/ticket.css" />
  <link rel="stylesheet" href="css/design.css" />
  <link rel="stylesheet" href="css/devtool.css" />
  <link rel="stylesheet" href="css/paytool.css" />
  <link rel="stylesheet" href="css/ops.css" />
  <link rel="stylesheet" href="css/final.css" />
  <link rel="stylesheet" href="css/teacher.css" />
  <link rel="stylesheet" href="css/student.css" />
</head>
<body>
  <div class="app" id="work-app">
    <!-- 상단 바 -->
    <header class="topbar">
      <div class="topbar-left">
        <span class="topbar-logo" aria-hidden="true"></span>
      </div>
      <div class="topbar-search">
        <svg viewBox="0 0 24 24"><path d="M10 2a8 8 0 1 0 4.9 14.3l5.4 5.4 1.4-1.4-5.4-5.4A8 8 0 0 0 10 2Zm0 2a6 6 0 1 1 0 12 6 6 0 0 1 0-12Z"/></svg>
        <span id="search-placeholder">DAYEON WORK 검색</span>
      </div>
      <div class="topbar-right">
        <button class="icon-btn" aria-label="도움말"><svg viewBox="0 0 24 24"><path d="M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20Zm0 18a8 8 0 1 1 0-16 8 8 0 0 1 0 16Zm-1-5h2v2h-2v-2Zm1-9a3.5 3.5 0 0 0-3.5 3.5h2a1.5 1.5 0 1 1 3 0c0 1.5-2.5 1.8-2.5 4h2c0-1.5 2.5-2 2.5-4A3.5 3.5 0 0 0 12 6Z"/></svg></button>
      </div>
    </header>

    <div class="body">
      <!-- 좌측 레일 -->
      <nav class="rail">
        <button class="rail-ws" id="rail-ws" title="DAYEON WORK">D</button>
        <button class="rail-item is-active" data-rail="home">
          <span class="rail-icon"><svg viewBox="0 0 24 24"><path d="M12 3 2 12h3v8h5v-6h4v6h5v-8h3L12 3Z"/></svg></span>
          <span>홈</span>
        </button>
        <button class="rail-item" data-rail="dm">
          <span class="rail-icon"><svg viewBox="0 0 24 24"><path d="M4 4h16a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H8l-4 4V6a2 2 0 0 1 2-2Z"/></svg><b class="rail-badge" id="rail-dm-badge" hidden></b></span>
          <span>DM</span>
        </button>
        <button class="rail-item" data-rail="activity">
          <span class="rail-icon"><svg viewBox="0 0 24 24"><path d="M12 22a2 2 0 0 0 2-2h-4a2 2 0 0 0 2 2Zm6-6V11a6 6 0 0 0-5-5.9V4a1 1 0 1 0-2 0v1.1A6 6 0 0 0 6 11v5l-2 2v1h16v-1l-2-2Z"/></svg><b class="rail-badge" id="rail-act-badge" hidden></b></span>
          <span>활동</span>
        </button>
        <button class="rail-item" data-rail="later">
          <span class="rail-icon"><svg viewBox="0 0 24 24"><path d="M6 2h12a1 1 0 0 1 1 1v19l-7-4-7 4V3a1 1 0 0 1 1-1Z"/></svg></span>
          <span>나중에</span>
        </button>
        <button class="rail-item" data-rail="more">
          <span class="rail-icon"><svg viewBox="0 0 24 24"><circle cx="5" cy="12" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="19" cy="12" r="2"/></svg></span>
          <span>더보기</span>
        </button>
        <div class="rail-spacer"></div>
        <button class="rail-plus" aria-label="추가">+</button>
        <div class="rail-me" id="rail-me" title="이서연"><span class="online"></span></div>
      </nav>

      <!-- 사이드바 -->
      <aside class="sidebar">
        <div class="sb-head">
          <button class="sb-ws" id="sb-ws" data-app-menu>
            <span id="sb-ws-name">DAYEON WORK</span>
            <svg viewBox="0 0 24 24"><path d="m7 10 5 5 5-5H7Z"/></svg>
          </button>
          <div class="sb-head-actions">
            <button class="icon-btn" aria-label="필터"><svg viewBox="0 0 24 24"><path d="M3 5h18v2H3V5Zm3 6h12v2H6v-2Zm3 6h6v2H9v-2Z"/></svg></button>
            <button class="icon-btn" aria-label="새 메시지"><svg viewBox="0 0 24 24"><path d="M3 17.3V21h3.7L17.8 9.9l-3.7-3.7L3 17.3ZM20.7 7a1 1 0 0 0 0-1.4l-2.3-2.3a1 1 0 0 0-1.4 0l-1.8 1.8 3.7 3.7L20.7 7Z"/></svg></button>
          </div>
        </div>
        <div class="sb-company" id="sb-company">다연컴퍼니</div>

        <div class="sb-scroll">
          <div class="sb-quick">
            <button class="sb-row"><svg viewBox="0 0 24 24"><path d="M4 4h16v12H7l-3 3V4Z"/></svg><span>스레드</span></button>
            <button class="sb-row"><svg viewBox="0 0 24 24"><path d="M3 4h18v2H3V4Zm0 7h18v2H3v-2Zm0 7h18v2H3v-2Z"/></svg><span>디렉터리</span></button>
            <button class="sb-row"><svg viewBox="0 0 24 24"><path d="M12 3a9 9 0 0 0-9 9v5a3 3 0 0 0 3 3h2v-7H5v-1a7 7 0 0 1 14 0v1h-3v7h2a3 3 0 0 0 3-3v-5a9 9 0 0 0-9-9Z"/></svg><span>허들</span></button>
          </div>

          <div class="sb-section">
            <button class="sb-section-title"><svg viewBox="0 0 24 24"><path d="m7 10 5 5 5-5H7Z"/></svg><span>채널</span></button>
            <ul class="sb-list" id="list-channels"></ul>
            <button class="sb-row sb-add"><span class="sb-add-icon">+</span><span>채널 추가</span></button>
          </div>

          <div class="sb-section">
            <button class="sb-section-title"><svg viewBox="0 0 24 24"><path d="m7 10 5 5 5-5H7Z"/></svg><span>다이렉트 메시지</span></button>
            <ul class="sb-list" id="list-dms"></ul>
          </div>
        </div>
      </aside>

      <!-- 메인 -->
      <main class="main">
        <header class="ch-head">
          <div class="ch-title">
            <button class="icon-btn star" aria-label="즐겨찾기"><svg viewBox="0 0 24 24"><path d="m12 2 3 6.6 7 .8-5.2 4.8 1.4 7L12 17.7 5.8 21.2l1.4-7L2 9.4l7-.8L12 2Z"/></svg></button>
            <h1><span class="ch-prefix" id="ch-prefix">#</span><span id="ch-name">전체공지</span></h1>
            <button class="icon-btn" aria-label="채널 메뉴"><svg viewBox="0 0 24 24"><path d="m7 10 5 5 5-5H7Z"/></svg></button>
          </div>
          <div class="ch-actions">
            <button class="pill" id="ch-members"><svg viewBox="0 0 24 24"><path d="M12 12a4 4 0 1 0 0-8 4 4 0 0 0 0 8Zm0 2c-3.3 0-8 1.7-8 5v1h16v-1c0-3.3-4.7-5-8-5Z"/></svg><span id="ch-members-n">28</span></button>
            <button class="pill"><svg viewBox="0 0 24 24"><path d="M12 3a9 9 0 0 0-9 9v5a3 3 0 0 0 3 3h2v-7H5v-1a7 7 0 0 1 14 0v1h-3v7h2a3 3 0 0 0 3-3v-5a9 9 0 0 0-9-9Z"/></svg><svg viewBox="0 0 24 24"><path d="m7 10 5 5 5-5H7Z"/></svg></button>
            <button class="icon-btn" aria-label="알림"><svg viewBox="0 0 24 24"><path d="M12 22a2 2 0 0 0 2-2h-4a2 2 0 0 0 2 2Zm6-6V11a6 6 0 0 0-5-5.9V4a1 1 0 1 0-2 0v1.1A6 6 0 0 0 6 11v5l-2 2v1h16v-1l-2-2Z"/></svg></button>
            <button class="icon-btn" aria-label="검색"><svg viewBox="0 0 24 24"><path d="M10 2a8 8 0 1 0 4.9 14.3l5.4 5.4 1.4-1.4-5.4-5.4A8 8 0 0 0 10 2Zm0 2a6 6 0 1 1 0 12 6 6 0 0 1 0-12Z"/></svg></button>
            <button class="icon-btn" aria-label="더보기"><svg viewBox="0 0 24 24"><circle cx="12" cy="5" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="12" cy="19" r="2"/></svg></button>
          </div>
        </header>
        <div class="ch-tabs">
          <button class="tab is-active"><svg viewBox="0 0 24 24"><path d="M4 4h16a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H8l-4 4V6a2 2 0 0 1 2-2Z"/></svg>메시지</button>
          <button class="tab"><svg viewBox="0 0 24 24"><path d="M5 3h14a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2Zm2 4v2h10V7H7Zm0 4v2h10v-2H7Zm0 4v2h6v-2H7Z"/></svg>캔버스</button>
          <button class="tab"><svg viewBox="0 0 24 24"><path d="M16 3v2l-2 1v6l3 2v2h-4v6l-1 1-1-1v-6H7v-2l3-2V6L8 5V3h8Z"/></svg>핀</button>
          <button class="tab"><svg viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8l-6-6Zm-1 7V3.5L18.5 9H13Z"/></svg>파일</button>
          <button class="tab tab-plus">+</button>
        </div>

        <div class="messages" id="messages"></div>

        <div class="composer">
          <div class="composer-box">
            <div class="composer-input" id="composer" contenteditable="true" data-placeholder="#전체공지에 메시지 보내기"></div>
            <div class="composer-tools">
              <div class="composer-tools-left">
                <button class="icon-btn" aria-label="첨부">+</button>
                <span class="sep"></span>
                <button class="icon-btn txt" aria-label="서식">Aa</button>
                <button class="icon-btn" aria-label="이모지"><svg viewBox="0 0 24 24"><path d="M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20Zm0 18a8 8 0 1 1 0-16 8 8 0 0 1 0 16ZM8.5 11a1.5 1.5 0 1 0 0-3 1.5 1.5 0 0 0 0 3Zm7 0a1.5 1.5 0 1 0 0-3 1.5 1.5 0 0 0 0 3ZM12 17.5c2.3 0 4.3-1.4 5.1-3.5H6.9c.8 2.1 2.8 3.5 5.1 3.5Z"/></svg></button>
                <button class="icon-btn txt" aria-label="멘션">@</button>
                <span class="sep"></span>
                <button class="icon-btn" aria-label="영상"><svg viewBox="0 0 24 24"><path d="M3 6h12a2 2 0 0 1 2 2v2l4-2v8l-4-2v2a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2Z"/></svg></button>
                <button class="icon-btn" aria-label="음성"><svg viewBox="0 0 24 24"><path d="M12 14a3 3 0 0 0 3-3V5a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3Zm5-3h2a7 7 0 0 1-6 6.9V21h-2v-3.1A7 7 0 0 1 5 11h2a5 5 0 0 0 10 0Z"/></svg></button>
              </div>
              <button class="send" id="send" aria-label="보내기"><svg viewBox="0 0 24 24"><path d="M3 3l18 9-18 9 3-9-3-9Zm3.6 7.8L5.2 15.5 15.8 12 5.2 8.5l1.4 4.3h5.9v-2H6.6Z"/></svg></button>
            </div>
          </div>
        </div>
      </main>
    </div>
  </div>

  <!-- DAYEON TASK (업무 시스템) -->
  <div class="tapp" id="task-app" hidden>
    <header class="t-head">
      <button class="t-brand" id="t-brand" data-app-menu>
        <svg viewBox="0 0 24 24"><path d="M3 3h8v8H3V3Zm10 0h8v8h-8V3ZM3 13h8v8H3v-8Zm10 0h8v8h-8v-8Z" fill="none" stroke="currentColor" stroke-width="2"/></svg>
        <span>DAYEON TASK</span>
        <svg class="t-caret" viewBox="0 0 24 24"><path d="m7 10 5 5 5-5H7Z"/></svg>
      </button>
      <nav class="t-crumb" id="t-crumb"></nav>
      <div class="t-head-right">
        <span class="t-me"><b id="t-me-avatar"></b><span id="t-me-name"></span></span>
      </div>
    </header>
    <div class="t-body">
      <aside class="t-side">
        <button class="t-nav is-active" data-tnav="mine"><svg viewBox="0 0 24 24"><path d="M4 5h16v2H4V5Zm0 6h16v2H4v-2Zm0 6h10v2H4v-2Z"/></svg>나의 업무 <b class="t-nav-n" id="t-nav-n"></b></button>
        <button class="t-nav" data-tnav="team"><svg viewBox="0 0 24 24"><path d="M16 11a3 3 0 1 0 0-6 3 3 0 0 0 0 6Zm-8 0a3 3 0 1 0 0-6 3 3 0 0 0 0 6Zm0 2c-2.3 0-7 1.2-7 3.5V19h8v-2.5c0-1 .4-1.9 1.1-2.6A11 11 0 0 0 8 13Zm8 0c-.3 0-.6 0-1 .1 1.2.9 2 2 2 3.4V19h6v-2.5c0-2.3-4.7-3.5-7-3.5Z"/></svg>팀 업무</button>
        <button class="t-nav" data-tnav="cal"><svg viewBox="0 0 24 24"><path d="M7 2h2v2h6V2h2v2h3v18H4V4h3V2Zm-1 8v10h12V10H6Z"/></svg>캘린더</button>
        <button class="t-nav" data-tnav="eval" id="t-nav-eval"><svg viewBox="0 0 24 24"><path d="M12 2 9.5 8.5 2.5 9l5.3 4.6L6.2 21 12 17.3 17.8 21l-1.6-7.4L21.5 9l-7-.5L12 2Z"/></svg>근무평가서</button>
        <button class="t-nav" data-tnav="report"><svg viewBox="0 0 24 24"><path d="M5 3h10l4 4v14H5V3Zm2 8v2h10v-2H7Zm0 4v2h7v-2H7Z"/></svg>보고서</button>
      </aside>
      <main class="t-main" id="task-content"></main>
    </div>
  </div>

  <!-- 앱 전환 메뉴 -->
  <div class="app-menu" id="app-menu" hidden>
    <div class="app-menu-title">앱 전환</div>
    <button class="app-menu-item" data-app="work"><span class="app-dot work">W</span><span><b>DAYEON WORK</b><small>사내 메신저</small></span><i class="check"></i></button>
    <button class="app-menu-item" data-app="task"><span class="app-dot task">T</span><span><b>DAYEON TASK</b><small>업무 관리 시스템</small></span><i class="check"></i></button>
    <button class="app-menu-item" data-app="ticket" hidden><span class="app-dot ticket">ON</span><span><b>TICKET ON</b><small>공연 예매 테스트 사이트</small></span><i class="check"></i></button>
    <button class="app-menu-item" data-app="design" hidden><span class="app-dot design">D</span><span><b>DAYEON DESIGN</b><small>디자인 검수 뷰어</small></span><i class="check"></i></button>
    <button class="app-menu-item" data-app="ops" hidden><span class="app-dot ops">▲</span><span><b>DAYEON DEPLOY</b><small>배포 · 형상 관리</small></span><i class="check"></i></button>
    <button class="app-menu-item" data-app="dev" hidden><span class="app-dot dev">{ }</span><span><b>DAYEON DEV TOOLS</b><small>프런트엔드 디버깅 도구</small></span><i class="check"></i></button>
  </div>

  <!-- DAYEON DEV TOOLS (TASK-003) — devtool.js 가 내용을 그림 -->
  <div class="dtapp" id="dev-app" hidden></div>

  <!-- DAYEON DESIGN (디자인 검수 뷰어) — design.js 가 내용을 그림 -->
  <div class="dapp" id="design-app" hidden></div>

  <!-- DAYEON DEPLOY (배포·형상 관리, TASK-005/006) — ops.js 가 내용을 그림 -->
  <div class="opapp" id="ops-app" hidden></div>

  <!-- TICKET ON (테스트 사이트) — ticket.js 가 내용을 그림 -->
  <div class="tkapp" id="ticket-app" hidden></div>

  <!-- 교사용 진행 도구 (숨김) -->
  <div id="teacher-root"></div>

  <!-- 알림 토스트 -->
  <div class="toasts" id="toasts"></div>

  <!-- 실시간 수업 모드용 (Firebase 설정이 없으면 로컬 시뮬레이션) -->
  <script src="https://www.gstatic.com/firebasejs/10.12.4/firebase-app-compat.js" onerror="this.remove()"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.4/firebase-auth-compat.js" onerror="this.remove()"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.4/firebase-database-compat.js" onerror="this.remove()"></script>
  <script src="js/firebase-config.js" onerror="this.remove()"></script>
  <script src="js/data.js"></script>
  <script src="js/state.js"></script>
  <script src="js/sync.js"></script>
  <script src="js/chat.js"></script>
  <script src="js/task.js"></script>
  <script src="js/ticket.js"></script>
  <script src="js/design.js"></script>
  <script src="js/devtool.js"></script>
  <script src="js/paytool.js"></script>
  <script src="js/ops.js"></script>
  <script src="js/eval.js"></script>
  <script src="js/final.js"></script>
  <script src="js/teacher.js"></script>
  <script src="js/live.js"></script>
</body>
</html>
