<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>DTALK 로그인</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <!-- 상단 바 -->
  <header class="topbar">
    <span class="topbar-note">수업에 참여하는 팀이신가요?</span>
    <a href="student.html" class="topbar-link" id="topbar-link">수업 코드로 입장</a>
  </header>

  <!-- 로그인 화면 -->
  <main class="screen" id="login-screen">
    <div class="brand-logo" role="img" aria-label="DTALK 로고"></div>

    <h1 class="title">DTALK에 로그인</h1>
    <p class="subtitle">회사에서 발급받은 <strong>사원번호</strong>로 로그인하는 것을 권장합니다.</p>

    <div class="sso">
      <button type="button" class="btn-outline" id="sso-google">
        <svg viewBox="0 0 48 48" aria-hidden="true">
          <path fill="#EA4335" d="M24 9.5c3.5 0 6.6 1.2 9.1 3.5l6.8-6.8C35.8 2.4 30.3 0 24 0 14.6 0 6.5 5.4 2.6 13.2l7.9 6.1C12.4 13.5 17.7 9.5 24 9.5z"/>
          <path fill="#4285F4" d="M46.5 24.5c0-1.6-.1-3.1-.4-4.5H24v9h12.7c-.6 3-2.3 5.5-4.8 7.2l7.7 6c4.5-4.2 6.9-10.3 6.9-17.7z"/>
          <path fill="#FBBC05" d="M10.5 28.7A14.5 14.5 0 0 1 9.7 24c0-1.6.3-3.2.8-4.7l-7.9-6.1A24 24 0 0 0 0 24c0 3.9.9 7.5 2.6 10.8l7.9-6.1z"/>
          <path fill="#34A853" d="M24 48c6.3 0 11.7-2.1 15.6-5.8l-7.7-6c-2.1 1.4-4.8 2.3-7.9 2.3-6.3 0-11.6-4-13.5-9.8l-7.9 6.1C6.5 42.6 14.6 48 24 48z"/>
        </svg>
        Google로 로그인
      </button>
      <button type="button" class="btn-outline" id="sso-ms">
        <svg viewBox="0 0 23 23" aria-hidden="true">
          <rect x="1" y="1" width="10" height="10" fill="#F25022"/>
          <rect x="12" y="1" width="10" height="10" fill="#7FBA00"/>
          <rect x="1" y="12" width="10" height="10" fill="#00A4EF"/>
          <rect x="12" y="12" width="10" height="10" fill="#FFB900"/>
        </svg>
        Microsoft로 로그인
      </button>
    </div>

    <div class="divider"><span>또는</span></div>

    <form class="form" id="login-form" autocomplete="off" novalidate>
      <input type="text" class="input" name="empno" id="empno" placeholder="사원번호 (예: 2024-0117)" />
      <div class="input-wrap">
        <input type="password" class="input" name="password" id="password" placeholder="비밀번호" />
        <button type="button" class="eye" id="toggle-pw" aria-label="비밀번호 보기">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M12 5c-5 0-9 4.5-10 7 1 2.5 5 7 10 7s9-4.5 10-7c-1-2.5-5-7-10-7Zm0 11.5a4.5 4.5 0 1 1 0-9 4.5 4.5 0 0 1 0 9Zm0-7a2.5 2.5 0 1 0 0 5 2.5 2.5 0 0 0 0-5Z"/>
          </svg>
        </button>
      </div>

      <p class="error" id="error" role="alert" hidden>사원번호 또는 비밀번호가 올바르지 않습니다.</p>

      <button type="submit" class="btn-primary" id="submit">로그인</button>
    </form>

    <div class="notice">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M12 2l1.8 5.2L19 9l-5.2 1.8L12 16l-1.8-5.2L5 9l5.2-1.8L12 2zm7 11l.9 2.6 2.6.9-2.6.9L19 20l-.9-2.6-2.6-.9 2.6-.9L19 13zM5 14l.7 2 2 .7-2 .7L5 19.5l-.7-2.1-2-.7 2-.7L5 14z"/>
      </svg>
      <p>비밀번호를 잊으셨나요? <a href="#" class="link" id="find-pw">비밀번호 재설정</a>을 요청하거나 IT 헬프데스크(내선 7700)로 문의하세요.</p>
    </div>

    <p class="muted">
      계정이 없으신가요? <a href="#" class="link" id="helpdesk">관리자에게 문의</a>
    </p>
  </main>

  <footer class="footer">
    <a href="#">개인정보 처리방침</a>
    <a href="#">이용약관</a>
    <a href="#">고객지원</a>
    <span class="footer-region">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20Zm7.9 9h-3a15.6 15.6 0 0 0-1.5-6.3A8 8 0 0 1 19.9 11ZM12 20c-1.1 0-2.6-2.3-3-7h6c-.4 4.7-1.9 7-3 7Zm-3-9c.4-4.7 1.9-7 3-7s2.6 2.3 3 7H9Zm-.4-6.3A15.6 15.6 0 0 0 7.1 11h-3a8 8 0 0 1 4.5-6.3ZM4.1 13h3a15.6 15.6 0 0 0 1.5 6.3A8 8 0 0 1 4.1 13Zm11.3 6.3A15.6 15.6 0 0 0 16.9 13h3a8 8 0 0 1-4.5 6.3Z"/></svg>
      한국어 (대한민국)
    </span>
  </footer>

  <script src="js/app.js"></script>
</body>
</html>
